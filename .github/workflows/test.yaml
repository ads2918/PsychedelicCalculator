name: Run Jest Tests
on: [push, pull_request] # Triggers on every push or PR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Gets your code
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node_version: '20' # Use your project's Node version
      - run: npm install      # Install dependencies
      - run: npm test         # Run your Jest tests